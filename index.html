<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Money Tracker</h1>
        
        <div class="balance">
            <h2>Your Balance</h2>
            <p id="balance">$0.00</p>
        </div>

        <!-- Only total expenses now -->
        <div class="income-expense">
            <div class="expense" style="flex:1;">
                <h3>Total Expenses</h3>
                <p id="expense">$0.00</p>
            </div>
        </div>

        <div class="form">
            <h3>Add Expense</h3>

            <!-- Category: Me / Family / Other -->
            <div class="form-control">
                <label for="main-category">Category</label>
                <select id="main-category">
                    <option value="Me">Me</option>
                    <option value="Family">Family</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Subcategory: depends on Category -->
            <div class="form-control">
  <label for="sub-category">Subcategory</label>
  <select id="sub-category"></select>
  <input type="text" id="sub-category-other" placeholder="Enter subcategory" style="display:none; margin-top:8px;">
</div>

            <div class="form-control">
                <label for="text">Description</label>
                <input type="text" id="text" placeholder="Enter reason for spending">
            </div>

            <div class="form-control">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="Enter amount" step="0.01">
            </div>

            <button class="btn" id="add-transaction">Add Expense</button>
        </div>

        <div class="history">
            <h3>Expense History</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Subcategory</th>
                        <th>Description</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDKs MUST be before script.js -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

    <!-- Your app logic -->
    <script src="script.js"></script>
</body>
</html>
